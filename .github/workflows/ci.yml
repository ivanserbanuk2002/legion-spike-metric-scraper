name: CI
on: push

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Rust 1.75.0
        run: rustup toolchain install 1.75.0 --profile minimal --component clippy,rustfmt
      - name: Check formatting
        run: cargo +1.75.0 fmt --check
      - name: Clippy
        run: cargo +1.75.0 clippy --locked --all-targets -- -D warnings
      - name: Test
        run: cargo +1.75.0 test --locked

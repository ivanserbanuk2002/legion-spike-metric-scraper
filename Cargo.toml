[package]
name = "legion-spike-metric-scraper"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "A local JSON metric ranking spike"
publish = false

[dependencies]
clap = { version = "=4.4.18", default-features = false, features = ["derive", "std", "help", "usage", "error-context"] }
serde = { version = "=1.0.195", features = ["derive"] }
serde_json = "=1.0.111"
